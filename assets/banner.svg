<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Luban Noor - Full-Stack Developer">
  <title>Luban Noor — Full-Stack Developer</title>
  <defs>
    <filter id="blurdark" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="edgedark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#860808"/>
      <stop offset="55%" stop-color="#990e0e"/>
      <stop offset="100%" stop-color="#cf1b1b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="#000000"/>
  <rect width="900" height="300" fill="#FFFFFF" opacity="0"/>
  
  <g filter="url(#blurdark)" opacity="0.62">
    <ellipse cx="144" cy="66" rx="150" ry="96" fill="#860808" opacity="0.55">
      <animate attributeName="cx" values="144;216;117;144" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="66;102;48;66" dur="23s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="738" cy="210" rx="168" ry="98" fill="#990e0e" opacity="0.34">
      <animate attributeName="cx" values="738;666;774;738" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;174;228;210" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="504" cy="276" rx="120" ry="72" fill="#cf1b1b" opacity="0.28">
      <animate attributeName="opacity" values="0.18;0.34;0.18" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect width="900" height="300" fill="url(#edgedark)" opacity="0.05"/>

  <!-- status pill -->
  <g transform="translate(56,54)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#F3E7D3" fill-opacity="0.8" stroke="#000000"/>
    <circle cx="18" cy="15" r="4" fill="#6B1F2B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#6B1F2B">OPEN TO COLLABORATE</text>
  </g>

  <!-- name -->
  <text x="56" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#F3E7D3">Luban Noor</text>
  <!-- underline draws itself, once -->
  <path d="M58 182 H470" stroke="url(#edgedark)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="412" stroke-dashoffset="412">
    <animate attributeName="stroke-dashoffset" values="412;0" dur="1.1s" begin="0.25s" fill="freeze"/>
  </path>
  <text x="56" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="600" fill="#F3E7D3">Entrepreneur  ·  Full Stack Web &amp; Cross-Platform Software Developer</text>
  <text x="56" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="13" fill="#d5ccbc">AI-Assisted Builder</text>
  <text x="56" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="12.5" fill="#aaa294">Chittagong, Bangladesh</text>

  <!-- soft specular sweep across the whole card -->
  <g clip-path="url(#clipdark)">
    <rect x="-320" y="-40" width="200" height="380" fill="#FFFFFF" opacity="0.09" transform="skewX(-14)">
      <animate attributeName="x" values="-340;1080" dur="7s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.6" y="0.6" width="898.8" height="298.8" rx="22" fill="none" stroke="#6B1F2B" stroke-width="1.2"/>
  <defs>
    <clipPath id="clipdark"><rect x="1" y="1" width="898" height="298" rx="22"/></clipPath>
  </defs>
</svg>
